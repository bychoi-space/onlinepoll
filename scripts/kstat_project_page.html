    <script type="text/javascript">
        function goPage(arg1, arg2, arg3) {
            switch(arg1)
            {
                case 0:
                    frm.action = "https://survey.kstat.co.kr/kstat_survey/1_project/tapi_project.php";
                    return frm.submit();
                break;

                case 1:
                    frm.action = "https://survey.kstat.co.kr/kstat_survey/1_project/tapi_project_proc.php?proc=" + arg2;
                    return frm.submit();
                break;

                case 2:
                    if(arg2.indexOf('/')!==-1) {
                        frm.action = "https://survey.kstat.co.kr/kstat_survey/" + arg2 + ".php";
                    } else {
                        frm.action = arg2 + ".php";
                    }
                    return frm.submit();
                break;

                case 3:
                    if(arg2.indexOf('/')!==-1) {
                        frm.action = "https://survey.kstat.co.kr/kstat_survey/" + arg2 + ".php" + arg3;
                    } else {
                        frm.action = arg2 + ".php" + arg3;
                    }
                    return frm.submit();
                break;

                case 4:
                    frm.action = arg2 + ".php" + arg3;
                    return frm.submit();
                break;

                default:
                    frm.action="";
                break;
            }
        }

<script type="text/javascript">
function tapi_move(josa, prid, opt1, page) {
    setLocal('tapi_josa',josa);
    setLocal('tapi_prid',prid);
    setLocal('tapi_opt1',opt1);

    frm.pridSel.value=prid;

    // 갈 화면은 getListPage(inc/lib/site.php)에서 정함

}
