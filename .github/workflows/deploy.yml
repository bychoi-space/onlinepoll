name: Auto Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Google Cloud Compute Engine
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          echo "🚀 [Deploy] Setting up SSH key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "🚀 [Deploy] Connecting to GCP VM (34.64.233.77)..."
          set +e
          ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_deploy choiby01@34.64.233.77 "cd ~/onlinepoll && git pull origin main && npm install --production=false && pm2 restart onlinepoll" > /tmp/ssh.log 2>&1
          SSH_EXIT=$?
          if [ $SSH_EXIT -ne 0 ]; then
            B64=$(tail -n 30 /tmp/ssh.log | base64 -w 0)
            echo "::error title=SSH_B64::$B64"
            exit $SSH_EXIT
          fi
          echo "✅ [Deploy] Deployment completed successfully!"
