name: Auto Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Google Cloud Compute Engine
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          SEOUL_HOST: ${{ secrets.GCP_SEOUL_HOST }}
        run: |
          echo "🚀 [Deploy] Setting up SSH key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          DEPLOY_CMD='
            chmod 755 "$HOME"
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
            PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPRoUMDz/EQ7f7KdvQIRwFrfD2ioX2PJkpoQgnPndlF3 online_advertising_deploy"
            grep -qxF "$PUB_KEY" "$HOME/.ssh/authorized_keys" || echo "$PUB_KEY" >> "$HOME/.ssh/authorized_keys"
            sudo chown -R choiby01:choiby01 "$HOME/.ssh" 2>/dev/null || true
            sudo sed -i "s/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/" /etc/ssh/sshd_config 2>/dev/null || true
            sudo systemctl restart ssh 2>/dev/null || sudo systemctl restart sshd 2>/dev/null || true
            sudo systemctl restart google-guest-agent 2>/dev/null || true
            free -h && df -h / && cd ~/onlinepoll && git fetch origin main && rm -f public/app.js public/styles.css public/b2b.css public/color-blocks.css public/survey-blueprint.html public/survey-blueprint.js public/mock-survey.html public/mock-survey-b2b.html public/mock-survey.css design.md HANDOVER_MERCHANT_ASSOC_TASKS.md && git checkout origin/main -- src/ public/ data/onnuri_master_db.json data/kstat_survey_blueprint.json data/kstat_assoc_blueprint.json data/metrix_survey_blueprint.json data/hrc_energy_blueprint.json data/globalri_literacy_blueprint.json data/gallup_20263603_templates.json data/gallup_agriwork_blueprint.json data/kbpi_2027_brand_dict.json data/relim_forestry_blueprint.json data/sample_metrix_sign.png data/ceo_persona_pool.json data/respondent_persona_pool.json README.md scripts/ package.json .gitignore AGENTS.md .agents/ && (git archive origin/main data/quotas | tar -x --skip-old-files 2>/dev/null || true) && node scripts/sync-seed-quotas.js origin/main && npm install --production=false && node scripts/safe-pm2-restart.js
          '

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_deploy choiby01@8.230.14.1 "$DEPLOY_CMD"

          if [ -n "$SEOUL_HOST" ]; then
            echo "🌏 [Deploy Seoul] Deploying to Seoul region instance ($SEOUL_HOST)..."
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_deploy "choiby01@$SEOUL_HOST" "$DEPLOY_CMD"
          fi

          echo "✅ [Deploy] Deployment completed successfully!"
