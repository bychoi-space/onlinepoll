name: Auto Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Google Cloud Compute Engine
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          echo "🚀 [Deploy] Setting up SSH key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_deploy choiby01@8.230.14.1 '
            chmod 755 "$HOME"
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 600 "$HOME/.ssh/authorized_keys"
            PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPRoUMDz/EQ7f7KdvQIRwFrfD2ioX2PJkpoQgnPndlF3 online_advertising_deploy"
            grep -qxF "$PUB_KEY" "$HOME/.ssh/authorized_keys" || echo "$PUB_KEY" >> "$HOME/.ssh/authorized_keys"
            sudo chown -R choiby01:choiby01 "$HOME/.ssh" 2>/dev/null || true
            sudo sed -i "s/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/" /etc/ssh/sshd_config 2>/dev/null || true
            sudo systemctl restart ssh 2>/dev/null || sudo systemctl restart sshd 2>/dev/null || true
            sudo systemctl restart google-guest-agent 2>/dev/null || true
            free -h && df -h / && cd ~/onlinepoll && git fetch origin main && git checkout origin/main -- src/ public/ data/onnuri_master_db.json data/kstat_survey_blueprint.json data/kstat_assoc_blueprint.json data/metrix_survey_blueprint.json data/hrc_energy_blueprint.json data/globalri_literacy_blueprint.json data/sample_metrix_sign.png data/ceo_persona_pool.json data/quotas/ scripts/ package.json .gitignore AGENTS.md .agents/ && npm install --production=false && node scripts/safe-pm2-restart.js
          '
          echo "✅ [Deploy] Deployment completed successfully!"
