name: Auto Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Google Cloud Compute Engine
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          echo "🚀 [Deploy] Setting up SSH key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_deploy choiby01@34.64.233.77 "cd ~/onlinepoll && git fetch origin main && git checkout origin/main -- src/ public/ data/onnuri_master_db.json data/kstat_survey_blueprint.json data/kstat_assoc_blueprint.json data/metrix_survey_blueprint.json data/sample_metrix_sign.png data/ceo_persona_pool.json data/quotas/ scripts/ package.json .gitignore AGENTS.md .agents/ && npm install --production=false && node scripts/safe-pm2-restart.js"
          echo "✅ [Deploy] Deployment completed successfully!"
