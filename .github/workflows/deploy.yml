name: Auto Deploy to GCP VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Google Cloud Compute Engine
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          echo "🚀 [Deploy] Setting up SSH key..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "🚀 [Deploy] Connecting to GCP VM (34.64.233.77)..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_deploy choiby01@34.64.233.77 "cd ~/onlinepoll && git fetch origin main && cp -r data /tmp/onlinepoll_data_backup 2>/dev/null || true && git reset --hard origin/main && cp -r /tmp/onlinepoll_data_backup/* data/ 2>/dev/null || true && npm install --production=false && pm2 restart onlinepoll"
          echo "✅ [Deploy] Deployment completed successfully!"
