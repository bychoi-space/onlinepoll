<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설문조사 캠페인 - AutoSurvey AI</title>
  
  <!-- Pretendard Font (Variable & Standard) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Google Fonts: JetBrains Mono (Terminal/Code only) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="figma-base.css">
  <link rel="stylesheet" href="campaign.css">
  <link rel="stylesheet" href="custom-styles.css">
</head>
<body>

  <!-- Top Navigation (56px) -->
  <nav class="figma-top-nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <i class="fa-solid fa-layer-group"></i>
        <span>AutoSurvey</span>
        <span class="brand-badge">AI</span>
      </div>
      
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link-item active">캠페인 목록</a></li>
        <li><a href="quota-builder.html" class="nav-link-item">조사 쿼터 생성기</a></li>
      </ul>

      <div class="nav-actions">
        <button type="button" class="btn-pill-logout" id="btn-global-logout">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Canvas -->
  <main class="figma-container">
    
    <!-- Page Header -->
    <div class="page-header">
      <div class="page-title-wrap">
        <h1 class="page-title">설문조사 캠페인</h1>
        <p class="page-subtitle">수집된 조사 쿼터 DB와 설문 가이드라인을 기반으로 자동화를 실행하는 캠페인 목록입니다.</p>
      </div>
      <button id="btn-open-new-modal" class="btn-pill btn-pill-primary">
        <i class="fa-solid fa-plus"></i> 새 캠페인 등록
      </button>
    </div>

    <!-- 4-Stat Metric Summary -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon"><i class="fa-solid fa-folder-open"></i></div>
        <div class="metric-info">
          <span class="metric-label">전체 캠페인</span>
          <strong class="metric-value" id="stat-total-campaigns">0건</strong>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon b2b"><i class="fa-solid fa-building"></i></div>
        <div class="metric-info">
          <span class="metric-label">사업주 (B2B)</span>
          <strong class="metric-value" id="stat-b2b-campaigns">0건</strong>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon b2c"><i class="fa-solid fa-user"></i></div>
        <div class="metric-info">
          <span class="metric-label">개인 (B2C)</span>
          <strong class="metric-value" id="stat-b2c-campaigns">0건</strong>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon success"><i class="fa-solid fa-circle-check"></i></div>
        <div class="metric-info">
          <span class="metric-label">완료된 설문</span>
          <strong class="metric-value" id="stat-completed-campaigns">0건</strong>
        </div>
      </div>
    </section>

    <!-- Campaigns Grid Section -->
    <section class="campaigns-section mb-32">
      <div class="campaign-grid" id="campaign-list-container">
        <!-- JS로 동적 렌더링 -->
        <div class="empty-state empty-state-card">
          <i class="fa-solid fa-spinner fa-spin empty-state-icon"></i>
          <p class="empty-state-text">캠페인 목록을 불러오는 중입니다...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- New Campaign Modal -->
  <div class="modal-overlay figma-modal-backdrop" id="modal-new-campaign">
    <div class="modal-card figma-modal-dialog">
      <div class="modal-header flex-between mb-16">
        <h3 class="font-card-title m-0"><i class="fa-solid fa-folder-plus"></i> 새 설문조사 캠페인</h3>
        <button type="button" class="btn-close" id="btn-close-modal">&times;</button>
      </div>
      <form id="form-new-campaign">
        <div class="form-group mb-12">
          <label for="new-title" class="figma-label">설문조사 제목 <span class="required">*</span></label>
          <input type="text" id="new-title" class="figma-input" required placeholder="예: 2026 소상공인 배달앱 수수료 실태조사" />
        </div>
        <div class="form-group mb-16">
          <label for="new-desc" class="figma-label">설문 설명</label>
          <input type="text" id="new-desc" class="figma-input" placeholder="예: 외식업 점주 대상 정책 지원 실태 조사" />
        </div>
        <div class="form-group mb-20">
          <label class="figma-label">조사 대상 유형 <span class="required">*</span></label>
          <div class="segmented-mode-group m-0">
            <label class="segmented-mode-item active" id="modal-tab-b2b">
              <input type="radio" name="new-quota-type" value="b2b" checked />
              <i class="fa-solid fa-building"></i>
              <span>사업주 (B2B)</span>
            </label>
            <label class="segmented-mode-item" id="modal-tab-b2c">
              <input type="radio" name="new-quota-type" value="b2c" />
              <i class="fa-solid fa-user"></i>
              <span>개인 (B2C)</span>
            </label>
          </div>
        </div>
        <div class="modal-actions flex-end gap-10">
          <button type="button" class="btn-pill btn-pill-secondary" id="btn-cancel-modal">취소</button>
          <button type="submit" class="btn-pill btn-pill-primary">
            <i class="fa-solid fa-arrow-right"></i> 생성 후 상세 설정 이동
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="campaign-list.js"></script>
  <script type="module" src="nav-auth.js"></script>
</body>
</html>
